name: RTHK Sunday Auto Download

on:
  schedule:
    # Sunday 13:00 HKT = Sunday 05:00 UTC
    - cron: "0 5 * * 0"
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install ffmpeg and rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Restore rclone config
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > "$HOME/.config/rclone/rclone.conf"
          rclone listremotes

      - name: Download Sunday MP3 if matched
        env:
          TZ: Asia/Hong_Kong
        run: |
          TODAY=$(date +%F)
          echo "Checking Sunday date: $TODAY"
          python scripts/scan_rthk.py \
            --start "$TODAY" \
            --end "$TODAY" \
            --max-pages 5 \
            --download \
            --download-dir downloads

      - name: Show downloaded files
        run: |
          echo "Downloaded files:"
          find downloads -type f || true

      - name: Upload to Google Drive via rclone
        run: |
          rclone copy downloads "drive:freeaswind" \
            --ignore-existing \
            --drive-chunk-size 64M \
            --transfers 2 \
            --checkers 4 \
            --progress

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rthk-sunday-download-logs
          path: output/*.csv
          if-no-files-found: ignore
