name: Audit Sunday Historical Episodes

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg and rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yt-dlp google-genai

      - name: Restore rclone config
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' \
            "$RCLONE_CONFIG_CONTENT" \
            > "$HOME/.config/rclone/rclone.conf"

          echo "Defined rclone remotes:"
          rclone listremotes

      - name: Run Sunday historical audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/audit_sunday_history.py

      - name: Show audit CSV
        if: always()
        run: |
          if [ -f audit_output/sunday_history_audit.csv ]; then
            cat audit_output/sunday_history_audit.csv
          else
            echo "Audit CSV not generated."
          fi

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rthk-sunday-history-audit
          path: |
            audit_output/*.csv
            audit_output/*.txt
          if-no-files-found: ignore
