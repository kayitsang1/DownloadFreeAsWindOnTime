name: RTHK Backfill Scan

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date"
        required: true
        default: "2025-10-01"
      end_date:
        description: "End date"
        required: true
        default: "2026-03-31"
      max_pages:
        description: "Max catchUp pages to scan"
        required: true
        default: "40"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RTHK scanner
        run: |
          python scripts/scan_rthk.py \
            --start "${{ github.event.inputs.start_date }}" \
            --end "${{ github.event.inputs.end_date }}" \
            --max-pages "${{ github.event.inputs.max_pages }}"

      - name: Upload CSV results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rthk-scan-results
          path: output/*.csv
          if-no-files-found: ignore
